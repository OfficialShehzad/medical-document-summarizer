<!DOCTYPE html>

<html>

    <head>
        <script src="https://cdn.tailwindcss.com"></script>
        <title>{% block title %}{% endblock %}</title>
        <!-- Toastr CSS -->
        <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.css">
        <!-- Toastr JS -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/toastr.js/latest/toastr.min.js"></script>
    </head>

    <body class="relative">

        {% if show_nav is not defined or show_nav %}
            {% include 'components/nav.html' %}
        {% endif %}

        {% block main %}{% endblock %}

        <div id="toast-container" class="fixed bottom-5 right-5 z-50 space-y-2"></div>

        <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
            integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
            crossorigin="anonymous"></script>
        <script type="text/javascript">
            function dropdown() {
                document.querySelector("#submenu").classList.toggle("hidden");
                document.querySelector("#arrow").classList.toggle("rotate-0");
            }
            dropdown();

            function openSidebar() {
                document.querySelector(".sidebar").classList.toggle("hidden");
            }
        </script>

        <!-- Flash messages as JSON -->
        <script id="flash-messages" type="application/json">
            {% with messages = get_flashed_messages(with_categories=true) %}
                {{ messages | tojson }}
            {% endwith %}
        </script>

        <!-- Toast script -->
        <script>
        const flashData = JSON.parse(document.getElementById("flash-messages").textContent);

        const toastColors = {
            success: 'bg-green-400 border border-green-400 text-green-700',
            error: 'bg-red-400 border border-red-400 text-red-700',
            danger: 'bg-red-400 border border-red-400 text-red-700',
            info: 'bg-blue-400 border border-blue-400 text-blue-700',
            warning: 'bg-yellow-400 border border-yellow-400 text-yellow-700',
        };

        flashData.forEach(([category, message]) => {
            const type = category === 'danger' ? 'error' : category;
            showToast(message, type);
        });

        function showToast(message, type = 'info') {
            const toast = document.createElement('div');
            toast.className = `toast transition-opacity duration-300 ease-in-out p-4 rounded shadow-md w-64 ${toastColors[type] || toastColors.info}`;
            toast.innerHTML = `
            <div class="flex items-start justify-between">
                <span class="text-[20px]">${message}</span>
                <button class="ml-4 text-lg leading-none focus:outline-none" onclick="this.parentElement.parentElement.remove()">&times;</button>
            </div>
            `;

            const container = document.getElementById('toast-container');
            container.appendChild(toast);

            setTimeout(() => {
            toast.classList.add('opacity-0');
            setTimeout(() => toast.remove(), 300);
            }, 3000); // Auto-hide after 3 seconds
        }
        </script>


    </body>

</html>
