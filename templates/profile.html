{% extends "./layout.html" %}

{% block title %}
Edit Profile
{% endblock %}

{% block main %}
<div class="min-h-screen bg-gray-100 py-10 px-6">
  <h1 class="text-4xl font-bold text-gray-800 mb-10 text-center">Edit Profile</h1>

  <div class="max-w-2xl mx-auto bg-white p-8 rounded-2xl shadow-lg">
    <form method="POST" class="space-y-6">
      <div>
        <label class="block mb-1 text-gray-700 font-semibold">Name</label>
        <input type="text" name="name" value="{{ profile.name }}" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block mb-1 text-gray-700 font-semibold">Age</label>
        <input type="number" name="age" value="{{ profile.age }}" required class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
      </div>

      <div>
        <label class="block mb-1 text-gray-700 font-semibold">Gender</label>
        <select name="gender" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="Male" {{ 'selected' if profile.gender == 'Male' else '' }}>Male</option>
          <option value="Female" {{ 'selected' if profile.gender == 'Female' else '' }}>Female</option>
          <option value="Other" {{ 'selected' if profile.gender == 'Other' else '' }}>Other</option>
        </select>
      </div>

      {% if user_type == 'user' %}
        <div>
          <label class="block mb-1 text-gray-700 font-semibold">Profession</label>
          <input type="text" name="profession" value="{{ profile.profession }}" class="w-full px-4 py-2 border border-gray-300 rounded-xl">
        </div>

        <div>
          <label class="block mb-1 text-gray-700 font-semibold">Height (cm)</label>
          <input type="number" name="height" step="0.1" value="{{ profile.height or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-xl">
        </div>

        <div>
          <label class="block mb-1 text-gray-700 font-semibold">Weight (kg)</label>
          <input type="number" name="weight" step="0.1" value="{{ profile.weight or '' }}" class="w-full px-4 py-2 border border-gray-300 rounded-xl">
        </div>
      {% else %}
        <div>
          <label class="block mb-1 text-gray-700 font-semibold">Specialization</label>
          <input type="text" name="specialization" value="{{ profile.specialization }}" class="w-full px-4 py-2 border border-gray-300 rounded-xl">
        </div>

        <div>
          <label class="block mb-1 text-gray-700 font-semibold">Certification</label>
          <input type="text" name="certification" value="{{ profile.certification }}" class="w-full px-4 py-2 border border-gray-300 rounded-xl">
        </div>
      {% endif %}

      <div class="text-center">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-6 rounded-xl transition duration-200">
          Save Changes
        </button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
